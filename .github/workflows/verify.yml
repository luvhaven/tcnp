name: Verify application
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Install isolated PostgreSQL security test runtime
        run: npm install --prefix .next/chat-sql-qa --no-audit --no-fund --package-lock=false @electric-sql/pglite@0.3.14
      - name: Install isolated form focus test runtime
        run: npm install --prefix .next/form-ui-qa --no-audit --no-fund --package-lock=false jsdom@26.1.0
      - run: npm test
      - run: npm run type-check
