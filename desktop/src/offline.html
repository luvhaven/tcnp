<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
<title>TCNP Central</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05070c; color: #f5f7fb; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { max-width: 26rem; padding: 2rem; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 26px; }
  h1 { margin: 1.5rem 0 .5rem; font-size: 1.5rem; }
  p { margin: 0; color: #a3aec2; line-height: 1.6; }
  a { display: inline-block; margin-top: 1.75rem; padding: .9rem 2rem; border-radius: 999px; background: #f26522; color: #fff; font-weight: 700; text-decoration: none; }
  a:hover { filter: brightness(1.08); }
  a:focus-visible { outline: 2px solid #ffb347; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Can’t reach TCNP</h1>
  <p>Check your internet connection, then try again.</p>
  <a href="https://tcnp.vercel.app">Try again</a>
</main>
</body>
</html>
